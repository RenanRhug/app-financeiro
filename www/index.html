<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: https://ssl.gstatic.com 'unsafe-eval'; style-src 'self' 'unsafe-inline'; media-src *; img-src 'self' data: content:;">
    <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>Meu Controle Financeiro</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <div class="app">
        <header>
            <h1>Controle Financeiro</h1>
        </header>

   
        <section class="form-section">
            <h2>Nova Movimentação</h2>
            <label for="descricao">Descrição</label>
            <input type="text" id="descricao" placeholder="Ex: Mercado, Salário">

            <label for="valor">Valor (R$)</label>
            <input type="number" id="valor" step="0.01" placeholder="0.00">

            <label for="tipo">Tipo</label>
            <select id="tipo">
                <option value="entrada">Entrada</option>
                <option value="saida">Saída</option>
            </select>

            <button id="adicionar">Adicionar</button>
        </section>

    
        <section class="lista-section">
            <h2>Minhas Movimentações</h2>
            <ul id="lista-transacoes"></ul>
        </section>

      
        <section class="resumo-section">
            <h2>Resumo</h2>
            <p><strong>Total de Entradas:</strong> R$ <span id="total-entradas">0.00</span></p>
            <p><strong>Total de Saídas:</strong> R$ <span id="total-saidas">0.00</span></p>
            <p><strong>Saldo:</strong> R$ <span id="saldo">0.00</span></p>
        </section>
    </div>

    <script src="cordova.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
